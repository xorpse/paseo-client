[package]
name = "paseo-client"
version = "0.1.0"
edition = "2024"
description = "Client for the Paseo daemon WebSocket protocol (relay/E2EE + local)"
license = "MIT"

[dependencies]
async-io = "2.6"
async-net = "2.0"
async-process = "2.5"
async-tungstenite = { version = "0.33", default-features = false, features = ["handshake", "futures-03-sink"] }
base64 = { version = "0.22", default-features = false, features = ["std"] }
crypto_box = { version = "0.9", features = ["std"] }
flume = { version = "0.12", default-features = false, features = ["async"] }
futures = "0.3"
futures-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
getrandom = "0.3.1"
log = "0.4"
parking_lot = "0.12"
percent-encoding = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
thiserror = "2.0"
url = "2"
uuid = { version = "1.13", features = ["v4"] }

[dev-dependencies]
anyhow = "1.0"
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
smol = "2.0"
webpki-roots = "1.0"
