[package]
name = "paseo-client"
version = "0.1.0"
edition = "2021"
description = "Client for the Paseo daemon WebSocket protocol (relay/E2EE + local)"
license = "MIT"

[dependencies]
anyhow = "1.0"
async-broadcast = "0.7"
async-net = "2.0"
async-trait = "0.1"
async-tungstenite = { version = "0.28", default-features = false, features = ["handshake", "futures-03-sink"] }
base64 = { version = "0.22", default-features = false, features = ["std"] }
crypto_box = { version = "0.9", features = ["std"] }
flume = "0.11"
futures = "0.3"
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
futures-util = "0.3"
getrandom = "0.3.1"
parking_lot = "0.12"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
url = "2"
uuid = { version = "1.13", features = ["v4"] }
webpki-roots = "0.26"

[dev-dependencies]
smol = "2.0"
